name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Chrome
        if: runner.os == 'Linux'
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb fonts-nanum

      - name: Regression tests
        run: |
          test_deps="$(mktemp -d)"
          trap 'rm -rf "$test_deps"' EXIT
          npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2
          NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs

      - name: Dial indicator
        run: |
          node examples/dial-indicator/build.mjs
          node examples/dial-indicator/build.mjs --light

      - name: Desk computer
        run: |
          node examples/desk-computer/build.mjs
          node examples/desk-computer/build.mjs --light

      - name: Arcade cabinet
        run: |
          node examples/arcade-cabinet/build.mjs
          node examples/arcade-cabinet/build.mjs --light

      - name: Ripple tank
        run: |
          node examples/ripple-tank/build.mjs
          node examples/ripple-tank/build.mjs --light

      - name: Turning dial
        run: |
          node examples/turning-dial/build.mjs
          node examples/turning-dial/build.mjs --light
          node examples/turning-dial/build.mjs --light --verify
          node examples/turning-dial/stress.mjs --light

      - name: Raptor engine
        run: |
          node examples/raptor-engine/build.mjs
          node examples/raptor-engine/build.mjs --light

      - name: Push button
        run: |
          node examples/push-button/build.mjs
          node examples/push-button/build.mjs --light

      - name: Sentence blocks
        run: |
          node examples/sentence-blocks/build.mjs
          node examples/sentence-blocks/build.mjs --light

      - name: Committed pages are unchanged
        run: |
          git status --short
          if ! git diff --quiet; then
            git diff --numstat
            python3 - << 'PY'
          import subprocess
          diff = subprocess.check_output(["git", "diff", "-U0"], text=True, errors="replace")
          minus = plus = None
          shown = 0
          for line in diff.splitlines():
              if line.startswith("diff --git"):
                  print(line)
                  minus = plus = None
              elif line.startswith("-") and not line.startswith("---"):
                  minus = line[1:]
              elif line.startswith("+") and not line.startswith("+++") and minus is not None:
                  plus = line[1:]
                  for i, (a, b) in enumerate(zip(minus, plus)):
                      if a != b:
                          print("at", i, repr(minus[max(0, i - 50):i + 50]), "=>", repr(plus[max(0, i - 50):i + 50]))
                          shown += 1
                          break
                  else:
                      print("length", len(minus), len(plus))
                  minus = None
                  if shown >= 4:
                      break
          PY
            exit 1
          fi
          test -z "$(git status --porcelain)"
